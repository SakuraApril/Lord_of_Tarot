<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>塔罗之主 - 重置密码</title>
    <style>
        :root {
            --void-black: #000001;
            --brass-gold: #FFD26A;
            --brass-gold-dark: #D4A843;
            --brass-light: #FFF8E7;
            --hyper-blue: #38BDF8;
            --cyan-accent: #20D0C0;
            --text-gold: #E8D5A3;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%; min-height: 100vh; background: var(--void-black);
            font-family: "Georgia", serif, system-ui; color: #e2e8f0;
        }
        .starfield { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .reset-container {
            position: relative; z-index: 1; max-width: 420px; margin: 0 auto;
            padding: 4rem 2rem 3rem; min-height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .reset-card {
            background: rgba(30,15,60,0.35); backdrop-filter: blur(16px);
            border: 1px solid rgba(214,168,67,0.15); border-radius: 16px;
            padding: 2.5rem 2rem; width: 100%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
        }
        .reset-card::before, .reset-card::after {
            content: ''; position: absolute; width: 12px; height: 12px;
            border: 2px solid var(--brass-gold-dark); pointer-events: none;
        }
        .reset-card::before { top: 6px; left: 6px; border-right: none; border-bottom: none; }
        .reset-card::after { bottom: 6px; right: 6px; border-left: none; border-top: none; }
        .reset-title { text-align: center; font-size: 1.5rem; color: var(--brass-light); letter-spacing: 4px; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1.2rem; }
        .form-label { display: block; font-size: 0.7rem; font-family: monospace; color: var(--cyan-accent); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 0.5rem; }
        .form-input {
            width: 100%; background: rgba(2,2,8,0.5); border: 1px solid rgba(255,210,106,0.2);
            border-radius: 10px; padding: 0.9rem 1rem; color: #fff;
            font-size: 0.95rem; outline: none; transition: all 0.3s;
        }
        .form-input:focus { border-color: var(--brass-gold); box-shadow: 0 0 20px rgba(255,210,106,0.15); }
        .form-input::placeholder { color: #3f3f46; }
        .submit-btn {
            width: 100%; padding: 0.9rem; background: linear-gradient(135deg, #4a3319, #241403);
            border: 1px solid var(--brass-gold-dark); border-radius: 25px;
            color: var(--brass-light); font-family: "Georgia", serif;
            font-size: 1rem; letter-spacing: 4px; cursor: pointer;
            transition: all 0.4s; margin-top: 0.5rem;
        }
        .submit-btn:hover { background: #fff; color: #000; border-color: #fff; box-shadow: 0 0 30px rgba(255,255,255,0.5); }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .msg-box { padding: 0.7rem 1rem; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1rem; display: none; }
        .msg-box.error { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #f87171; }
        .msg-box.success { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3); color: #4ade80; }
        .back-link { display: block; text-align: center; margin-top: 1.5rem; color: #64748b; font-size: 0.8rem; text-decoration: none; }
        .back-link:hover { color: var(--text-gold); }
    </style>
</head>
<body>
<canvas class="starfield" id="starfield"></canvas>
<div class="reset-container">
    <div class="reset-card">
        <h1 class="reset-title">重置密码</h1>
        <div id="msg" class="msg-box"></div>
        <form id="reset-form" onsubmit="handleReset(event)">
            <div class="form-group">
                <label class="form-label">新密码</label>
                <input class="form-input" type="password" id="new-password" placeholder="至少 6 位" required minlength="6">
            </div>
            <div class="form-group">
                <label class="form-label">确认密码</label>
                <input class="form-input" type="password" id="confirm-password" placeholder="再次输入" required minlength="6">
            </div>
            <button type="submit" class="submit-btn" id="reset-btn">重置密码</button>
        </form>
    </div>
    <a class="back-link" href="auth.html">✦ 返回登录 ✦</a>
</div>

<script src="js/auth.js"></script>
<script>
(function(){
    var cv=document.getElementById('starfield'),ctx=cv.getContext('2d');
    var stars=[];
    function resize(){cv.width=window.innerWidth;cv.height=window.innerHeight;}
    function init(){resize();stars=[];var n=Math.min(200,Math.floor(cv.width*cv.height/8000));for(var i=0;i<n;i++)stars.push({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.5+0.3,a:Math.random()*0.6+0.1,ph:Math.random()*Math.PI*2,sp:Math.random()*0.4+0.2});}
    function draw(ts){ctx.clearRect(0,0,cv.width,cv.height);var t=ts*0.001;for(var i=0;i<stars.length;i++){var s=stars[i];var alpha=s.a*(0.5+0.5*Math.sin(t*s.sp+s.ph));ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle='rgba(240,214,138,'+alpha+')';ctx.fill();}requestAnimationFrame(draw);}
    init();requestAnimationFrame(draw);window.addEventListener('resize',function(){resize();init();});
})();

function showMsg(text, type) {
    var box = document.getElementById('msg');
    box.textContent = text;
    box.className = 'msg-box ' + type;
    box.style.display = 'block';
}

var params = new URLSearchParams(window.location.search);
var token = params.get('token');
if (!token) {
    showMsg('缺少重置令牌，请从邮件中的链接访问', 'error');
    document.getElementById('reset-form').style.display = 'none';
}

async function handleReset(e) {
    e.preventDefault();
    if (!token) return;
    var pw = document.getElementById('new-password').value;
    var pw2 = document.getElementById('confirm-password').value;
    if (pw !== pw2) { showMsg('两次输入的密码不一致', 'error'); return; }
    var btn = document.getElementById('reset-btn');
    btn.disabled = true; btn.textContent = '重置中…';
    try {
        await Auth.resetPassword(token, pw);
        showMsg('密码重置成功！', 'success');
        setTimeout(function() { window.location.href = 'auth.html'; }, 2000);
    } catch (err) {
        showMsg(err.message, 'error');
        btn.disabled = false; btn.textContent = '重置密码';
    }
}
</script>
</body>
</html>
