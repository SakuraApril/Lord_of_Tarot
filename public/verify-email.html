<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>塔罗之主 - 邮箱验证</title>
    <style>
        :root {
            --void-black: #000001;
            --brass-gold: #FFD26A;
            --brass-gold-dark: #D4A843;
            --brass-light: #FFF8E7;
            --hyper-blue: #38BDF8;
            --cyan-accent: #20D0C0;
            --text-gold: #E8D5A3;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%; min-height: 100vh; background: var(--void-black);
            font-family: "Georgia", serif, system-ui; color: #e2e8f0;
        }
        .starfield { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .verify-container {
            position: relative; z-index: 1; max-width: 420px; margin: 0 auto;
            padding: 4rem 2rem 3rem; min-height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .verify-card {
            background: rgba(30,15,60,0.35); backdrop-filter: blur(16px);
            border: 1px solid rgba(214,168,67,0.15); border-radius: 16px;
            padding: 2.5rem 2rem; text-align: center; width: 100%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .verify-icon { font-size: 3rem; margin-bottom: 1rem; }
        .verify-title {
            font-size: 1.5rem; color: var(--brass-light); letter-spacing: 4px; margin-bottom: 1rem;
        }
        .verify-text { color: #a5b4fc; font-size: 0.9rem; line-height: 1.8; margin-bottom: 1.5rem; }
        .verify-btn {
            display: inline-block; padding: 0.8rem 2rem; background: linear-gradient(135deg, #4a3319, #241403);
            border: 1px solid var(--brass-gold-dark); border-radius: 25px;
            color: var(--brass-light); font-family: "Georgia", serif;
            font-size: 0.95rem; letter-spacing: 2px; text-decoration: none;
            transition: all 0.4s; cursor: pointer;
        }
        .verify-btn:hover { background: #fff; color: #000; border-color: #fff; box-shadow: 0 0 30px rgba(255,255,255,0.5); }
        .loading-text { color: var(--text-gold); font-size: 1rem; letter-spacing: 3px; }
        .back-link { display: block; text-align: center; margin-top: 1.5rem; color: #64748b; font-size: 0.8rem; text-decoration: none; }
        .back-link:hover { color: var(--text-gold); }
    </style>
</head>
<body>
<canvas class="starfield" id="starfield"></canvas>
<div class="verify-container">
    <div class="verify-card">
        <div class="verify-icon">✦</div>
        <h1 class="verify-title">邮箱验证</h1>
        <div id="verify-content">
            <p class="loading-text">正在验证…</p>
        </div>
    </div>
    <a class="back-link" href="index.html">✦ 返回星河 ✦</a>
</div>

<script src="js/auth.js"></script>
<script>
// 星空背景
(function(){
    var cv=document.getElementById('starfield'),ctx=cv.getContext('2d');
    var stars=[];
    function resize(){cv.width=window.innerWidth;cv.height=window.innerHeight;}
    function init(){resize();stars=[];var n=Math.min(200,Math.floor(cv.width*cv.height/8000));for(var i=0;i<n;i++)stars.push({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.5+0.3,a:Math.random()*0.6+0.1,ph:Math.random()*Math.PI*2,sp:Math.random()*0.4+0.2});}
    function draw(ts){ctx.clearRect(0,0,cv.width,cv.height);var t=ts*0.001;for(var i=0;i<stars.length;i++){var s=stars[i];var alpha=s.a*(0.5+0.5*Math.sin(t*s.sp+s.ph));ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle='rgba(240,214,138,'+alpha+')';ctx.fill();}requestAnimationFrame(draw);}
    init();requestAnimationFrame(draw);window.addEventListener('resize',function(){resize();init();});
})();

(async function(){
    var content = document.getElementById('verify-content');
    var params = new URLSearchParams(window.location.search);
    var token = params.get('token');
    if (!token) {
        content.innerHTML = '<p style="color:#f87171">缺少验证令牌</p><a class="verify-btn" href="auth.html" style="margin-top:1rem">去登录</a>';
        return;
    }
    try {
        await Auth.verifyEmail(token);
        content.innerHTML = '<p style="color:#4ade80;margin-bottom:1.5rem">邮箱验证成功！</p><a class="verify-btn" href="auth.html">立即登录</a>';
    } catch (err) {
        content.innerHTML = '<p style="color:#f87171;margin-bottom:1.5rem">' + err.message + '</p><a class="verify-btn" href="auth.html">去登录</a>';
    }
})();
</script>
</body>
</html>
